## Environment-Specific Configuration

### Development (local preview)
```bash
# Start local server with live reload
mkdocs serve

# Specify custom port
mkdocs serve -a localhost:8080

# Dirty reload for faster iteration (skips plugin processing)
mkdocs serve --dirtyreload
```

### Production (GitHub Pages deployment)
```bash
# Build with strict validation (fails on warnings)
mkdocs build --strict

# Deploy to gh-pages branch
mkdocs gh-deploy --force
```

---

## Validation Command

Before committing changes to `mkdocs.yml`:

```bash
# Test configuration validity
mkdocs build --strict

# Check for YAML syntax errors
python -c "import yaml; yaml.safe_load(open('mkdocs.yml'))"

# Preview changes locally
mkdocs serve
```

---

## Extension Points

### Custom CSS (FR-018)
```yaml
extra_css:
  - assets/css/custom.css
```

Place custom styles in `/docs/assets/css/custom.css`. Will be included after Material theme CSS, allowing overrides without breaking core functionality.

### Custom JavaScript (if needed)
```yaml
extra_javascript:
  - assets/js/custom.js
```

Use sparingly - most features available through Material theme configuration.

### Additional Plugins (if needed)
```yaml
plugins:
  - search
  - git-revision-date-localized
  - minify
  - awesome-pages  # Example: Per-directory navigation customization
```

New plugins MUST NOT conflict with constitutional requirements (static-first, no backend).

---

## Breaking Changes

Changes that require documentation updates:

1. **Changing site_url**: Breaks existing external links
2. **Removing nav entries**: Breaks bookmarks/search engine results
3. **Changing theme**: Breaks custom CSS/JS
4. **Removing plugins**: May break features (e.g., search, last modified dates)
5. **Removing markdown extensions**: Breaks existing content using those features

Always test with `mkdocs build --strict` before deploying breaking changes.

