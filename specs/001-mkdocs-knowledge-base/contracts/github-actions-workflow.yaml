# ==============================================================================
# TROUBLESHOOTING
# ==============================================================================

# Common workflow failures:

# 1. "Permission denied to gh-pages branch"
#    Fix: Ensure permissions: contents: write in workflow

# 2. "mkdocs build failed with broken links"
#    Fix: Check error output for specific file/link, update in PR

# 3. "Workflow timeout after 6 hours"
#    Fix: Check for infinite loops, large file uploads, or missing cache

# 4. "pip install requirements.txt failed"
#    Fix: Verify requirements.txt is valid, dependencies exist on PyPI

# 5. "gh-pages branch conflicts"
#    Fix: --force flag in mkdocs gh-deploy handles this automatically

# ==============================================================================
# PERFORMANCE TARGETS
# ==============================================================================

# Based on SC-003, SC-005:
# - Deployment duration: Target <5 minutes, fail if >10 minutes
# - Build success rate: Monitor monthly, target >95%
# - Cache hit rate: Should be >80% for repeat builds

# Monitoring commands:
# - View workflow runs: gh run list --workflow=deploy.yml
# - Check failure rate: gh run list --status failure --limit 100
# - Download artifacts: gh run download <run-id>
