# GitHub Actions Workflow Contract

**Type**: CI/CD Specification
**File**: `.github/workflows/deploy.yml` (repository root)
**Purpose**: Defines the automated deployment workflow contract for MkDocs site

---

## Workflow Specification

```yaml
name: Deploy MkDocs to GitHub Pages

# Trigger conditions (REQUIRED for FR-003, FR-004)
on:
  push:
    branches:
      - main  # Deploy on every push to main branch
  pull_request:
    branches:
      - main  # Validate builds on PRs before merge (FR-012)

# Minimal permissions (Security requirement from Constitution)
permissions:
  contents: write  # Required for gh-pages deployment only

# Concurrent workflow control
concurrency:
  group: pages
  cancel-in-progress: false  # Don't cancel in-progress deployments

jobs:
  # Job 1: Build and validate
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git-revision-date-localized plugin

      # Step 2: Setup Python environment
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache dependencies for faster builds

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Validate configuration
      - name: Validate MkDocs configuration
        run: |
          python -c "import yaml; yaml.safe_load(open('mkdocs.yml'))"
          echo " mkdocs.yml is valid YAML"

      # Step 5: Build site with strict validation (FR-012, FR-020)
      - name: Build MkDocs site (strict mode)
        run: |
          mkdocs build --strict --verbose
        env:
          CI: true

      # Step 6: Check for large files (FR-023)
      - name: Check file sizes
        run: |
          echo "Checking for files exceeding 5 MB..."
          large_files=$(find docs -type f -size +5M 2>/dev/null || true)
          if [ -n "$large_files" ]; then
            echo "L Error: The following files exceed 5 MB limit:"
            echo "$large_files"
            echo ""
            echo "Please optimize these files before committing."
            echo "See CONTRIBUTING.md for image optimization guidance."
            exit 1
          fi
          echo " All files are within size limits"

      # Step 7: Upload build artifacts (for PR preview)
      - name: Upload build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/
          retention-days: 7

  # Job 2: Deploy to GitHub Pages (main branch only)
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Step 1: Checkout code with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Python environment
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Build site
      - name: Build MkDocs site for deployment
        run: mkdocs build --strict

      # Step 5: Deploy to gh-pages branch (FR-003, FR-005)
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --message "[ci skip] Deploy {sha} from {branch}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Post deployment notification
      - name: Deployment success notification
        run: |
          echo " Successfully deployed to GitHub Pages"
          echo "Site URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

  # Job 3: Deployment failure handling (FR-021, FR-022)
  notify-failure:
    name: Notify on deployment failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()

    steps:
      - name: Deployment failure notification
        run: |
          echo "L Deployment failed"
          echo "Previous deployment remains live (automatic rollback)"
          echo "Check workflow logs for details"
          echo ""
          echo "Common failure causes:"
          echo "  - Broken internal links (check mkdocs build output)"
          echo "  - Invalid YAML in mkdocs.yml"
          echo "  - Missing required files referenced in navigation"
          echo "  - Plugin errors (check dependency versions)"

      # Optional: Send email/Slack notification (implement if needed)
      - name: Send notification (placeholder)
        run: |
          echo "TODO: Configure email/Slack webhook for repository owner notification"
          echo "Repository owner will receive GitHub Actions failure email by default"
```

