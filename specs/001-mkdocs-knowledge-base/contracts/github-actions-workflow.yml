## Monitoring

### Workflow Status
- Navigate to repository ’ Actions tab
- View workflow run history
- Click individual runs for detailed logs

### Deployment Status
- Navigate to repository ’ Environments ’ github-pages
- View deployment history and timestamps
- Click "View deployment" to visit live site

### Performance Monitoring
- Use Lighthouse in Chrome DevTools
- Target: >90 score (SC-010)
- Run on deployed site, not localhost

