## Validation Rules

### Build Validation (FR-012)
-  `mkdocs build --strict` must succeed
-  YAML configuration must be valid
-  All internal links must resolve
-  All referenced files must exist
-  All navigation entries must have corresponding pages

### File Size Validation (FR-023)
-  Individual files must be d5 MB
-  Check runs on all files in `/docs` directory
-  Failure provides guidance per FR-024

### Deployment Validation
-  Must complete within 5 minutes (SC-003)
-  Must only deploy from main branch
-  Must use minimal `contents: write` permission
-  Must preserve previous deployment on failure (FR-021)

