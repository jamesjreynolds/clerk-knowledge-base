## Workflow Behavior

### Pull Request Flow
1. Contributor creates PR targeting main branch
2. Workflow triggers `build` job only
3. Validates YAML configuration
4. Runs `mkdocs build --strict` to catch errors
5. Checks file sizes against 5 MB limit
6. Uploads build artifacts for preview (optional manual download)
7. PR shows green check if build succeeds, red X if fails
8. Build failure blocks merge (if branch protection enabled)

### Main Branch Deployment Flow
1. PR merged or direct push to main branch
2. Workflow triggers both `build` and `deploy` jobs sequentially
3. Build job validates and generates site
4. Deploy job pushes to `gh-pages` branch
5. GitHub Pages automatically publishes updated site
6. Deployment completes within 5 minutes (SC-003 target)
7. If deployment fails, `gh-pages` branch not updated (automatic rollback per FR-021)

