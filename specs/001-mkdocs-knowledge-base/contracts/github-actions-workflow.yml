## Troubleshooting

### Common Workflow Failures

#### 1. Build Fails: "Error: 404 page not found"
**Cause**: Navigation references non-existent page
**Fix**: Check `mkdocs.yml` nav section, ensure all referenced paths exist in `/docs`

#### 2. Build Fails: "Config validation error"
**Cause**: Invalid YAML syntax in `mkdocs.yml`
**Fix**: Validate YAML locally with `python -c "import yaml; yaml.safe_load(open('mkdocs.yml'))"`

#### 3. Deployment Fails: "Permission denied"
**Cause**: Insufficient workflow permissions
**Fix**: Enable "Read and write permissions" in repository Settings ’ Actions ’ General

#### 4. Files Exceed Size Limit
**Cause**: Image files >5 MB committed
**Fix**: Compress images using TinyPNG, ImageOptim, or squoosh.app before committing

#### 5. Git History Plugin Fails
**Cause**: Shallow Git clone (missing history)
**Fix**: Ensure workflow uses `fetch-depth: 0` in checkout step

### Local Testing

Before pushing, test the workflow steps locally:

```bash
# Validate YAML
python -c "import yaml; yaml.safe_load(open('mkdocs.yml'))"

# Check file sizes
find docs -type f -size +5M

# Build with strict validation
mkdocs build --strict

# Preview locally
mkdocs serve
```

